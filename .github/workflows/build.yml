name: Build Blockline

# Builds a Windows .exe, a macOS binary, and a Linux .AppImage using the
# existing build.py script. Runs on every push of a version tag
# (v1.0.0 etc.) and can also be triggered manually from the Actions tab.
#
# NOTE: this assumes main.py / build.py / ui.py / languages/ / engine/
# sit at the repository root. If your repo nests everything under a
# subfolder (e.g. source/), add `working-directory: source` to each
# step below, or a `defaults: run: working-directory: source` block
# at the job level.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # Second layer of defense alongside build.py's own stdout
      # reconfigure() call: forces the whole interpreter into UTF-8
      # mode before any code runs, so Windows' default cp1252 console
      # can't choke on Unicode symbols (checkmarks etc.) in build
      # output.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows exe
        run: python build.py --target exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blockline-Windows
          path: dist/Blockline.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS binary
        run: python build.py --target binary-only

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blockline-macOS
          path: dist/Blockline

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          # libfuse2/libfuse2t64 intentionally NOT installed here -
          # build.py already detects if it's missing and falls back to
          # APPIMAGE_EXTRACT_AND_RUN automatically, which is more
          # robust across different Ubuntu runner versions than
          # hardcoding one package name.

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Linux AppImage
        run: python build.py --target appimage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blockline-Linux
          path: dist/Blockline-x86_64.AppImage

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Blockline-Windows
          path: dist-windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Blockline-macOS
          path: dist-macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Blockline-Linux
          path: dist-linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-windows/Blockline.exe
            dist-macos/Blockline
            dist-linux/Blockline-x86_64.AppImage
          generate_release_notes: true
